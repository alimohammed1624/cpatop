name: Release

# Push a tag like v0.2.0 to build release binaries and attach them to a
# GitHub release for that tag.
#
# Asset names are deliberately version-independent (cpatop-<target>.tar.gz,
# containing a top-level cpatop-<target>/ dir) so that
# https://github.com/alimohammed1624/cpatop/releases/latest/download/<asset>
# always resolves. Keep asset names in sync with install.sh.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            tool: cargo
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            tool: cross
          - os: macos-latest
            target: aarch64-apple-darwin
            tool: cargo
          - os: macos-latest
            target: x86_64-apple-darwin
            tool: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.tool == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        run: ${{ matrix.tool }} build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          # Keep asset names in sync with install.sh.
          name=cpatop-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/cpatop README.md LICENSE CHANGELOG.md config.example.toml "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            target/${{ matrix.target }}/release/cpatop

  macos-universal:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-apple-darwin"
      - name: lipo
        shell: bash
        run: |
          # Keep asset names in sync with install.sh.
          name=cpatop-universal-apple-darwin
          mkdir -p "dist/$name"
          lipo -create -output "dist/$name/cpatop" \
            aarch64-apple-darwin/target/aarch64-apple-darwin/release/cpatop \
            x86_64-apple-darwin/target/x86_64-apple-darwin/release/cpatop
          chmod +x "dist/$name/cpatop"
          lipo -info "dist/$name/cpatop"
          cp README.md LICENSE CHANGELOG.md config.example.toml "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: universal-apple-darwin
          path: dist/*.tar.gz

  release:
    needs: [build, macos-universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir out
          find artifacts -name '*.tar.gz' -exec cp {} out/ \;
          # install.sh looks up "<hash>  cpatop-<target>.tar.gz" lines here.
          (cd out && sha256sum *.tar.gz > SHA256SUMS)
          ls -l out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
