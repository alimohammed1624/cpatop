[package]
name = "cpatop"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "A btop-style terminal dashboard for CPA Usage Keeper metrics"
license = "MIT"
readme = "README.md"
repository = "https://github.com/alimohammed1624/cpatop"
homepage = "https://github.com/alimohammed1624/cpatop"
keywords = ["tui", "dashboard", "ratatui", "cliproxyapi", "monitoring"]
categories = ["command-line-utilities", "visualization"]
exclude = ["docs/screenshots/", "scripts/", ".github/", ".githooks/"]

[features]
default = ["keyring"]
# OS keyring support (macOS Keychain / freedesktop Secret Service).
keyring = [
    "dep:keyring-core",
    "dep:apple-native-keyring-store",
    "dep:zbus-secret-service-keyring-store",
]

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "query", "stream", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
toml_edit = { version = "0.25.19", default-features = false, features = ["parse", "display"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
directories = "6.0.0"
color-eyre = { version = "0.6.5", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
url = "2.5.8"
unicode-width = "0.2.3"
fastrand = "2.5.0"
rpassword = "7.5.5"

keyring-core = { version = "1.0.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", optional = true, features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", optional = true, features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
insta = "1.49.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
wiremock = "0.6.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
